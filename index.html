<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue — allow access?</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #e8ecf5; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { width: min(92vw, 420px); background: #141a2e; border: 1px solid #263052; border-radius: 16px; padding: 28px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 8px 0; color: #b7c0d8; }
  .who { color: #e8ecf5; font-weight: 600; }
  ul { padding-left: 20px; color: #b7c0d8; }
  .row { display: flex; gap: 12px; margin-top: 20px; }
  button { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid #263052; background: #1c2542; color: #e8ecf5; font-size: 16px; cursor: pointer; }
  button.primary { background: #2f6bff; border-color: #2f6bff; }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: #ff8a8a; white-space: pre-wrap; }
  .muted { font-size: 13px; color: #7f8aa8; }
</style>
</head>
<body>
<main id="app"><h1>Blue</h1><p id="status">Checking your sign-in…</p></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = "https://hgfktbhjegakgzqqimbg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_12YPySCowwHtXPMG8d3eLQ_m0L2UB1_";
const app = document.getElementById('app');
const setStatus = (t) => { document.getElementById('status').textContent = t; };
const fail = (msg) => { app.innerHTML = '<h1>Blue</h1><p class="err"></p>'; app.querySelector('.err').textContent = msg; };

const params = new URLSearchParams(location.search);
const authorizationId = params.get('authorization_id');
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

try {
  if (!authorizationId) {
    fail('This page is only reached from a connector authorization request (missing authorization_id). Nothing to approve.');
  } else {
    // 1. Signed in? If not, go through Google and come straight back here.
    let { data: { session } } = await sb.auth.getSession();
    if (!session) {
      setStatus('Signing you in with Google…');
      const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href } });
      if (error) fail('Sign-in failed: ' + error.message);
    } else {
      // 2. What is being asked?
      setStatus('Loading the request…');
      const { data: details, error } = await sb.auth.oauth.getAuthorizationDetails(authorizationId);
      if (error) throw error;
      const client = details?.client?.name ?? details?.client_name ?? 'an app';
      const scopes = details?.scopes ?? details?.scope?.split(' ') ?? [];
      const email = session.user.email ?? session.user.id;
      app.innerHTML = `
        <h1>Allow <span class="who">${client}</span> to act as you?</h1>
        <p>Signed in as <span class="who">${email}</span>.</p>
        <p>This is the <b>Blue write connector</b>. Approving lets it read your data and <b>propose</b> changes; every actual change still needs your tap in the Claude app and is receipted.</p>
        ${scopes.length ? '<p>Requested scopes:</p><ul>' + scopes.map(s => '<li>' + s + '</li>').join('') + '</ul>' : ''}
        <div class="row"><button id="deny">Deny</button><button id="approve" class="primary">Approve</button></div>
        <p class="muted">Not you? Deny, then sign out of Google in this browser.</p>`;
      const buttons = [...app.querySelectorAll('button')];
      const go = async (fn) => {
        buttons.forEach(b => b.disabled = true);
        const { data, error } = await fn(authorizationId);
        if (error) { buttons.forEach(b => b.disabled = false); fail(error.message); return; }
        const to = data?.redirect_to ?? data?.redirectTo;
        if (to) location.href = to; else fail('Done, but no redirect was returned. You can close this tab.');
      };
      document.getElementById('approve').onclick = () => go((id) => sb.auth.oauth.approveAuthorization(id));
      document.getElementById('deny').onclick = () => go((id) => sb.auth.oauth.denyAuthorization(id));
    }
  }
} catch (e) {
  fail((e && e.message) || String(e));
}
</script>
</body>
</html>
