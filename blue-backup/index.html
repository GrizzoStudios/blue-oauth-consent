<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Backup</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1d2330; --muted: #5a6475; --accent: #2f5fd0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11151c; --fg: #e6e9ef; --muted: #9aa3b2; --accent: #8fb0ff; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 12px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Blue Backup</h1>
  <p>A private, single-user tool that writes a nightly backup of its owner's own app data into a folder in the owner's own Google Drive. It uses Google's <code>drive.file</code> permission, so it can only see the files it created.</p>
  <p>It is not a public service and has no sign-up.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
